# Broker menolak klien tanpa kredensial (PRD: Kontrol keamanan).
persistence true
persistence_location /mosquitto/data/
allow_anonymous false
password_file /mosquitto/data/passwd

listener 1883          # internal Docker, dipakai jembatan
listener 8883          # gateway gedung lewat TLS
cafile   /mosquitto/data/certs/ca.crt
certfile /mosquitto/data/certs/server.crt
keyfile  /mosquitto/data/certs/server.key
