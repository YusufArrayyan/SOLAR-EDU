# Blueprint Render: Dashboard Render > New > Blueprint > pilih repo ini.
# Satu layanan web (Docker) mode produksi dengan disk permanen untuk SQLite dan berkas model.
# Data meter dikirim gateway ke https://<layanan>.onrender.com/api/ingest dengan header X-Ingest-Token.
services:
  - type: web
    name: solar-edu
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter            # disk permanen butuh paket berbayar; paket free tidak mendukung disk
    region: singapore
    healthCheckPath: /api/sehat
    autoDeploy: true
    disk:
      name: solar-data
      mountPath: /srv/backend/data
      sizeGB: 1
    envVars:
      - key: SOLAR_SIMULATION   # 0 = produksi: data nyata dari gateway meter, tanpa data simulasi dan akun demo
        value: "0"
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_EMAIL        # akun asli tim pengelola, diisi saat membuat Blueprint
        sync: false
      - key: ADMIN_PASSWORD     # minimal 10 karakter; ganti lagi di halaman Akun setelah masuk
        sync: false
      - key: ADMIN_NAMA
        value: Admin tim pengelola
      - key: INGEST_TOKEN
        generateValue: true
      - key: WEATHER_LIVE       # prakiraan cuaca Open-Meteo; wajib untuk fitur suhu dan radiasi model
        value: "1"
